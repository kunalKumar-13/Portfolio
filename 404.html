:root{--bg:#08080A;--t1:#EDEDEF;--t2:#A2A2AC;--t3:#8C8C96;--t4:#7E7E87;--acc:#7C87FF;
  --s:'Inter','Inter Fallback',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--m:'JetBrains Mono',ui-monospace,monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:var(--bg);color:var(--t1);font-family:var(--s);-webkit-font-smoothing:antialiased;
  display:grid;place-items:center;padding:32px;position:relative;overflow-x:hidden}
body::before{content:'';position:absolute;inset:0;pointer-events:none;

.b{position:relative;max-width:520px;text-align:center}
.code{font-family:var(--m);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}

p{color:var(--t2);font-size:16px;line-height:1.65;margin-top:14px}
.go{display:inline-flex;align-items:center;gap:9px;margin-top:28px;padding:12px 20px;border-radius:9px;

.go:hover{transform:translateY(-2px);box-shadow:0 12px 28px -12px rgba(124,135,255,.6)}
.go:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.alt{margin-top:20px;display:flex;gap:20px;justify-content:center;flex-wrap:wrap;font-family:var(--m);font-size:12px}
.alt a{color:var(--t4);text-decoration:none;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.alt a:hover{color:var(--t2);border-color:var(--t4)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
